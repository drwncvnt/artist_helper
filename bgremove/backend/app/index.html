<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Background Remover - drwncvnt</title>
<link rel="stylesheet" href="/shared/xp.css" />
<script defer src="https://stats.drwncvnt.com/script.js" data-website-id="e842424d-b5e8-4642-960e-46be6f5c2aa1"></script>
<script src="/shared/platform-ui.js" defer></script>
<style>
  body { display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; }
  .bgr { width: 560px; max-width: 100%; margin: 24px 12px; }
  .bgr .body { padding: 12px; }
  .status {
    border: 1px inset var(--face); background: var(--field-bg);
    padding: 8px; margin-top: 10px; font-size: 11px; min-height: 34px;
  }
  .status.err { color: var(--danger); }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .preview-box {
    border: 1px inset var(--face); background: var(--field-bg);
    display: flex; align-items: center; justify-content: center;
    min-height: 160px; overflow: hidden;
  }
  .preview-box.checker {
    background-image:
      linear-gradient(45deg, #c9c9c9 25%, transparent 25%), linear-gradient(-45deg, #c9c9c9 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c9c9c9 75%), linear-gradient(-45deg, transparent 75%, #c9c9c9 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #efefef;
  }
  .preview-box img { max-width: 100%; max-height: 260px; display: block; }
  .preview-label { font-size: 10px; color: #505050; text-align: center; margin-top: 3px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bgr">
  <div class="window">
    <div class="titlebar">
      <div class="titlebar-icon"></div>
      <span class="titlebar-text">Background Remover</span>
      <div class="titlebar-buttons">
        <a class="status-link" href="/" style="color:#fff; border-color:#6a8ec8;">&#8592; Hub</a>
      </div>
    </div>

    <div class="menubar">
      <span role="button" tabindex="0" data-platform-help>Help</span>
      <span role="button" tabindex="0" data-platform-aboba>aboba</span>
    </div>

    <div class="body">
      <p class="hint" style="margin-bottom: 12px;">
        Upload a photo and get back a PNG with the background cut out.
        JPG, PNG or WebP - the result always has a transparent background.
      </p>

      <form id="form" class="groupbox">
        <div class="field">
          <label class="field-label" for="file">Photo</label>
          <input type="file" id="file" accept="image/jpeg,image/png,image/webp" required />
        </div>
        <div class="dialog-actions" style="margin-top: 10px;">
          <button type="submit" class="btn primary" id="submitBtn">Remove background</button>
          <a href="#" id="downloadBtn" class="btn hidden" download="cutout.png">Download PNG</a>
        </div>
      </form>

      <div class="status hint" id="status">Ready.</div>

      <div class="previews hidden" id="previews">
        <div>
          <div class="preview-box"><img id="beforeImg" alt="Original" /></div>
          <div class="preview-label">Original</div>
        </div>
        <div>
          <div class="preview-box checker"><img id="afterImg" alt="Result" /></div>
          <div class="preview-label">Background removed</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const form = document.getElementById('form');
  const fileEl = document.getElementById('file');
  const submitBtn = document.getElementById('submitBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('status');
  const previewsEl = document.getElementById('previews');
  const beforeImg = document.getElementById('beforeImg');
  const afterImg = document.getElementById('afterImg');

  let resultUrl = null;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.classList.toggle('err', !!isError);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = fileEl.files[0];
    if (!file) return;

    if (resultUrl) {
      URL.revokeObjectURL(resultUrl);
      resultUrl = null;
    }
    previewsEl.classList.add('hidden');
    downloadBtn.classList.add('hidden');
    submitBtn.disabled = true;
    setStatus('Removing background... this can take a few seconds, longer if others are ahead of you in line.');

    const beforeUrl = URL.createObjectURL(file);
    beforeImg.src = beforeUrl;

    const fd = new FormData();
    fd.append('file', file);

    try {
      const res = await fetch('api/remove', { method: 'POST', body: fd, credentials: 'include' });
      if (!res.ok) {
        let detail = 'Could not process that image.';
        try {
          const data = await res.json();
          detail = data.detail || detail;
        } catch {}
        setStatus(detail, true);
        return;
      }

      const blob = await res.blob();
      resultUrl = URL.createObjectURL(blob);
      afterImg.src = resultUrl;
      downloadBtn.href = resultUrl;
      previewsEl.classList.remove('hidden');
      downloadBtn.classList.remove('hidden');
      setStatus('Done.');
    } catch {
      setStatus('Network error. Please try again.', true);
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
